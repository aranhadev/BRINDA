name: brinda-aranha
services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://$${POSTGRES_USER:-brinda}:$${POSTGRES_PASSWORD}@database:5432/$${POSTGRES_DB:-brinda}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./backend:/app
    depends_on:
      database:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_ORIGIN: http://localhost:3001
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - api
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: $${POSTGRES_DB:-brinda}
      POSTGRES_USER: $${POSTGRES_USER:-brinda}
      POSTGRES_PASSWORD: $${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-brinda} -d $${POSTGRES_DB:-brinda}"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data: